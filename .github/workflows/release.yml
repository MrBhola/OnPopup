name: Release OnPopup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install Dependencies
        run: npm ci

      - name: Package Application
        run: npm run make

      - name: Debug Output Directory
        run: |
          ls -laR out/ > debug-${{ matrix.os }}.txt || echo "out directory does not exist" >> debug-${{ matrix.os }}.txt
          find . -name "*.dmg" -o -name "*.zip" -o -name "*.exe" >> debug-${{ matrix.os }}.txt
          cat debug-${{ matrix.os }}.txt

      - name: Upload Artifacts for Debugging
        uses: actions/upload-artifact@v4
        with:
          name: make-artifacts-${{ matrix.os }}
          path: |
            out/make/
            debug-${{ matrix.os }}.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            debug-*.txt
            out/make/**/*.dmg
            out/make/*.dmg
            out/make/**/*.zip
            out/make/*.zip
            out/make/**/*.exe
            out/make/*.exe
            out/make/**/*.deb
            out/make/*.deb
            out/make/**/*.rpm
            out/make/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
